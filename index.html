<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>biorenderpro · 科研图标库</title>
<style>
:root{--ink:#173742;--muted:#526f78;--line:#cadcde;--paper:#f3f8fa;--accent:#126873}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,main{max-width:1440px;margin:auto;padding:24px 32px}header{border-bottom:1px solid var(--line)}h1{font:600 34px/1.2 "Avenir Next","PingFang SC",sans-serif;margin:0 0 12px}p{margin:8px 0;color:var(--muted)}a{color:var(--accent)}nav{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}label{display:block;font-size:14px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:10px}input,select{width:100%;margin-top:5px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #e7a43e;outline-offset:3px}#status{margin:20px 0;font-family:Menlo,monospace;font-size:13px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}article{background:white;border:1px solid var(--line);border-top:3px solid var(--accent);padding:16px;min-width:0}article img{display:block;width:100%;height:150px;object-fit:contain;padding:8px;background:linear-gradient(90deg,#e6eff255 1px,transparent 1px),linear-gradient(#e6eff255 1px,transparent 1px);background-size:16px 16px}h2{font-size:15px;margin:12px 0 5px;overflow-wrap:anywhere}small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}details{margin-top:10px;font-size:12px;overflow-wrap:anywhere}summary{cursor:pointer}article a{display:inline-block;margin:10px 12px 0 0;font-size:13px}.pager{display:flex;gap:12px;margin:24px 0}.empty{padding:32px;border:1px dashed var(--line)}@media(max-width:700px){header,main{padding:20px}.filters{grid-template-columns:1fr}h1{font-size:28px}}
</style>
<header><h1>科研图标库</h1><p>细胞、器官、实验设备、分子通路与物种。预览后保存 SVG，署名信息随图可查。</p><p>开放科研素材合集；“biorender”仅为本机快捷入口名称。原始版与适配版可能重复。</p>
<nav><a href="icons/">图标文件夹</a><a href="COVERAGE.md">来源与收录范围</a><a href="https://github.com/duerrsimon/bioicons">Bioicons · GitHub</a><a href="https://github.com/Alex-D-C/SiliCoDraw/tree/main/icon-expansions">扩展图标包 · GitHub</a><a href="sources.json">来源记录</a></nav></header>
<main><div class="filters"><label>关键词<input id="q" type="search" placeholder="例如：monocyte、heart、pipette" autocomplete="off"></label><label>图标来源<select id="collection"><option value="">全部来源</option></select></label><label>分类<select id="category"><option value="">全部分类</option></select></label><label>素材类型<select id="kind"><option value="">全部类型</option></select></label><label>许可证<select id="license"><option value="">全部许可证</option></select></label></div><p id="status" role="status" aria-live="polite"></p><div id="grid"></div><div class="pager"><button id="prev">上一页</button><button id="next">下一页</button></div></main>
<script src="catalog.js"></script>
<script>
const q=document.querySelector('#q'),collection=document.querySelector('#collection'),category=document.querySelector('#category'),kind=document.querySelector('#kind'),license=document.querySelector('#license'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
let page=0;const size=60;
function options(select,values){for(const value of [...new Set(values)].sort()){const o=document.createElement('option');o.value=value;o.textContent=value;select.append(o)}}
const origins=r=>[r,...(r.also_available_from||[])];
options(collection,ICONS.flatMap(r=>origins(r).map(o=>o.collection)));options(category,ICONS.map(r=>r.category));options(kind,ICONS.map(r=>r.kind||'科研与技术'));options(license,ICONS.flatMap(r=>origins(r).map(o=>o.license)));
const search=ICONS.map(r=>[r.name,r.tags,r.category,r.author,r.collection,...origins(r).map(o=>o.name)].join(' ').toLowerCase());
function element(tag,text){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el}
function render(){
  const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows=ICONS.filter((r,i)=>origins(r).some(o=>(!collection.value||o.collection===collection.value)&&(!license.value||o.license===license.value))&&(!category.value||r.category===category.value)&&(!kind.value||r.kind===kind.value)&&terms.every(t=>search[i].includes(t)));
  const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages-1);grid.replaceChildren();
  status.textContent=`${rows.length.toLocaleString()} 个文件 / 共 ${ICONS.length.toLocaleString()} 个（文件去重后） · 第 ${page+1} / ${pages} 页`;
  for(const r of rows.slice(page*size,(page+1)*size)){
    const shown=origins(r).find(o=>(!collection.value||o.collection===collection.value)&&(!license.value||o.license===license.value));
    const localFile=globalThis.location?.protocol==='file:';
    const card=element('article'),img=element('img'),download=element('a',localFile?'打开 SVG':'保存 SVG'),source=element('a','来源'),details=element('details');
    img.src=shown.path.split('/').map(encodeURIComponent).join('/');img.alt=shown.name;img.loading='lazy';download.href=img.src;download.download=shown.path.split('/').pop();
    if(localFile){download.target='_blank';download.rel='noopener'}
    if(/^https?:\/\//.test(shown.source)){source.href=shown.source;source.target='_blank';source.rel='noopener noreferrer'}
    details.append(element('summary','查看署名'),element('p',shown.credit));
    if((r.also_available_from||[]).length)details.append(element('p',`另有 ${r.also_available_from.length} 个相同文件记录，已合并显示。`));
    card.append(img,element('h2',shown.name),element('small',shown.collection+' · '+r.category),element('small',shown.license),download,source,details);
    if(r.generative_ai_used)card.append(element('small','来源标记为 AI 生成；用于科研前请核对结构。'));
    if(r.contains_raster)card.append(element('small','此 SVG 内含位图，放大可能出现像素。'));
    grid.append(card);
  }
  if(!rows.length){const empty=element('p','未找到匹配图标，请尝试英文关键词，或清除筛选。');empty.className='empty';grid.append(empty)}
  prev.disabled=page===0;next.disabled=page>=pages-1;
}
q.addEventListener('input',()=>{page=0;render()});for(const s of [collection,category,kind,license])s.addEventListener('change',()=>{page=0;render()});prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};render();
</script></html>
